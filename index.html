<title>Angielski</title>
<style>
  :root {
    color-scheme: light;
    --tlo: #f3f4f6;
    --karta: #ffffff;
    --tekst: #17212b;
    --przygaszony: #667085;
    --akcent: #3a63d8;
    --akcent-tekst: #ffffff;
    --akcent-tlo: #e8eefb;
    --ok: #1f8a5b;
    --ok-tlo: #e3f4ec;
    --linia: #e3e6ec;
    --blad: #b42318;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --tlo: #12151c;
      --karta: #1b1f29;
      --tekst: #edf0f5;
      --przygaszony: #9aa3b4;
      --akcent: #7ea6f5;
      --akcent-tekst: #0b1020;
      --akcent-tlo: #1d2740;
      --ok: #4cb487;
      --ok-tlo: #1d3128;
      --linia: #2a2f3b;
      --blad: #ff8a80;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    background: var(--tlo); color: var(--tekst);
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    line-height: 1.45; -webkit-text-size-adjust: 100%;
  }
  .opakowanie { max-width: 34rem; margin: 0 auto; padding: 1.25rem 1rem 3rem; }
  h1 { font-size: 1.5rem; margin: 0; overflow-wrap: anywhere; }
  h2 { font-size: 1.05rem; margin: 1.4rem 0 .6rem; }
  .ukryte { display: none !important; }

  input, button { font: inherit; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; padding: .8rem .9rem;
    border: 1px solid var(--linia); border-radius: .65rem;
    background: var(--karta); color: var(--tekst); font-size: 1rem;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--akcent); outline-offset: 2px;
  }
  .przycisk {
    border: 0; border-radius: .65rem; padding: .8rem 1.1rem;
    background: var(--akcent); color: var(--akcent-tekst);
    font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-flex; align-items: center; justify-content: center; gap: .4rem;
  }
  .przycisk.drugi { background: transparent; color: var(--akcent); border: 1px solid var(--linia); }
  .przycisk.ok { background: var(--ok); color: #fff; }
  .przycisk:disabled { opacity: .5; cursor: default; }
  .link {
    background: none; border: 0; padding: .4rem 0;
    color: var(--przygaszony); text-decoration: underline; cursor: pointer; font-size: .9rem;
  }
  .rzad { display: flex; gap: .6rem; flex-wrap: wrap; }
  .rzad > .przycisk { flex: 1; min-width: 8rem; }
  .komunikat { min-height: 1.4rem; font-size: .9rem; margin: .3rem 0 0; }
  .komunikat.blad { color: var(--blad); }
  .komunikat.ok { color: var(--ok); }
  .duza-emotka { font-size: 2.6rem; line-height: 1; margin-bottom: .6rem; }
  .opis { color: var(--przygaszony); margin: .4rem 0 1.5rem; }

  /* logowanie */
  #logowanie { padding-top: 12vh; }
  #logowanie form { display: grid; gap: .7rem; }

  /* nagłówki */
  .naglowek { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
  .powitanie { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .naglowek small { color: var(--przygaszony); display: block; font-size: .85rem; }

  /* przełącznik z dwiema opcjami */
  .przelacznik { display: inline-flex; border: 1px solid var(--linia); border-radius: .65rem; overflow: hidden; background: var(--karta); }
  .przelacznik button {
    border: 0; background: none; color: var(--przygaszony);
    padding: .45rem .8rem; font-size: .85rem; font-weight: 600; cursor: pointer;
  }
  .przelacznik button[aria-pressed="true"] { background: var(--akcent); color: var(--akcent-tekst); }
  .wymowa { display: flex; align-items: center; gap: .6rem; color: var(--przygaszony); font-size: .85rem; }

  /* lekcje */
  #nowa-lekcja { display: flex; gap: .6rem; }
  #nowa-lekcja input { flex: 1; }
  ul { list-style: none; margin: 0; padding: 0; }
  .lekcja-karta {
    display: block; width: 100%; text-align: left;
    background: var(--karta); border: 1px solid var(--linia); border-left: 4px solid var(--akcent);
    border-radius: .65rem; padding: .85rem 1rem; margin-bottom: .55rem;
    color: var(--tekst); cursor: pointer;
  }
  .lekcja-karta.opanowana { border-left-color: var(--ok); }
  .lekcja-karta strong { display: block; overflow-wrap: anywhere; }
  .lekcja-karta small { color: var(--przygaszony); font-size: .8rem; }
  .pasek { height: .35rem; background: var(--linia); border-radius: 999px; margin-top: .55rem; overflow: hidden; }
  .pasek > span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
  .pusta { text-align: center; color: var(--przygaszony); padding: 2rem 0; }
  .pusta .duza-emotka { display: block; }

  /* widok lekcji */
  .tytul-wiersz { display: flex; align-items: center; gap: .4rem; margin: .2rem 0 .3rem; }
  .tytul-wiersz h1 { flex: 1; }
  .ikona {
    flex: none; width: 2.5rem; height: 2.5rem; border: 0; background: none;
    font-size: 1.15rem; cursor: pointer; border-radius: .5rem; color: var(--tekst);
  }
  .ikona:hover { background: var(--akcent-tlo); }
  .edycja, .potwierdzenie {
    background: var(--karta); border: 1px solid var(--linia); border-radius: .65rem;
    padding: .7rem; margin: .5rem 0; display: grid; gap: .6rem;
  }
  .potwierdzenie p { margin: 0; }
  #nowe-slowko { display: grid; gap: .6rem; margin-top: 1rem; }
  .pole-en { display: flex; gap: .5rem; }
  .pole-en input { flex: 1; }
  .emotka-przycisk {
    flex: none; width: 3rem; border: 1px solid var(--linia); border-radius: .65rem;
    background: var(--karta); font-size: 1.5rem; line-height: 1; cursor: pointer; color: var(--tekst);
  }
  .emotka-przycisk:hover { background: var(--akcent-tlo); }
  .emotka-slowka {
    flex: none; width: 2.6rem; height: 2.6rem; border: 0; background: none;
    font-size: 1.7rem; line-height: 1; cursor: pointer; border-radius: .5rem; padding: 0;
  }
  .emotka-slowka:hover { background: var(--akcent-tlo); }
  .brak-emotki { opacity: .35; filter: grayscale(1); }
  .fiszka .obrazek { font-size: 4rem; line-height: 1; }
  .glosnik {
    flex: none; width: 3rem; border: 1px solid var(--linia); border-radius: .65rem;
    background: var(--karta); font-size: 1.2rem; cursor: pointer; color: var(--tekst);
  }
  .glosnik:hover { background: var(--akcent-tlo); }
  .slowko {
    display: flex; align-items: center; gap: .3rem;
    background: var(--karta); border: 1px solid var(--linia); border-radius: .65rem;
    padding: .35rem .4rem .35rem .8rem; margin-bottom: .5rem;
  }
  .slowko.znam { border-left: 4px solid var(--ok); }
  .slowko .tresc { flex: 1; overflow-wrap: anywhere; }
  .slowko .tresc small { display: block; color: var(--przygaszony); font-size: .78rem; }
  .znacznik { color: var(--ok); font-size: .85rem; font-weight: 700; flex: none; }
  .usun { flex: none; width: 2.5rem; height: 2.5rem; border: 0; background: none; color: var(--przygaszony); font-size: 1.3rem; cursor: pointer; border-radius: .5rem; }
  .usun:hover { color: var(--blad); }
  .male-glosnik { flex: none; width: 2.5rem; height: 2.5rem; border: 0; background: none; font-size: 1.1rem; cursor: pointer; border-radius: .5rem; color: var(--tekst); }
  .male-glosnik:hover { background: var(--akcent-tlo); }

  /* fiszki */
  .postep { color: var(--przygaszony); font-size: .85rem; margin: .8rem 0 .4rem; display: flex; justify-content: space-between; }
  .fiszka {
    width: 100%; min-height: 13rem; margin: .6rem 0;
    border: 1px solid var(--linia); border-radius: 1rem; background: var(--karta);
    color: var(--tekst); cursor: pointer; padding: 1.2rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6rem;
    text-align: center; overflow-wrap: anywhere;
  }
  .fiszka .slowo { font-size: 2rem; font-weight: 700; }
  .fiszka .podpowiedz { color: var(--przygaszony); font-size: .85rem; }
  .fiszka .przyklad { color: var(--przygaszony); font-style: italic; font-size: .95rem; }
  .fiszka.odwrocona { background: var(--akcent-tlo); border-color: var(--akcent); }
  .wynik { text-align: center; padding: 1.5rem 0; }
  .wynik .duza-emotka { font-size: 3.2rem; }
  /* kot */
  .kot-pasek {
    display: flex; align-items: center; gap: .8rem;
    background: var(--karta); border: 1px solid var(--linia); border-radius: 1rem;
    padding: .55rem .9rem .55rem .6rem; margin: .9rem 0; min-height: 5.2rem;
  }
  .kot-ikona { flex: none; width: 4.6rem; display: block; }
  .kot-ikona svg { width: 100%; height: auto; display: block; animation: kot-bujanie 3.4s ease-in-out infinite; transform-origin: 50% 92%; }
  .kot-ikona.duzy { width: 8rem; margin: 0 auto 1rem; }
  .kot-dymek { flex: 1; min-width: 0; }
  .kot-dymek p { margin: 0; font-size: .95rem; overflow-wrap: anywhere; }
  .kot-seria { display: inline-block; margin-top: .35rem; font-size: .8rem; font-weight: 700; color: var(--akcent); background: var(--akcent-tlo); border-radius: 999px; padding: .1rem .6rem; }
  .kot-pasek.swiezy .kot-ikona svg { animation: kot-pop .45s ease-out; }
  @keyframes kot-bujanie { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-3px) rotate(-1.5deg); } }
  @keyframes kot-pop { 0% { transform: scale(.85); } 60% { transform: scale(1.1); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .kot-ikona svg, .kot-pasek.swiezy .kot-ikona svg { animation: none; } }
  .stopka { margin-top: 2rem; font-size: .8rem; color: var(--przygaszony); text-align: center; }
</style>
</head>
<body>
<div class="opakowanie">

  <!-- logowanie -->
  <section id="logowanie" class="ukryte">
    <div class="duza-emotka" aria-hidden="true">📚</div>
    <h1>Angielski</h1>
    <p class="opis">Zaloguj się adresem e-mail. Twoje lekcje i słówka widzisz tylko Ty.</p>
    <form id="formularz-logowania" novalidate>
      <input type="email" id="email" placeholder="E-mail" autocomplete="email" inputmode="email" required>
      <input type="password" id="haslo" placeholder="Hasło (min. 6 znaków)" autocomplete="current-password" required>
      <div class="rzad">
        <button type="submit" class="przycisk" id="zaloguj">Zaloguj</button>
        <button type="button" class="przycisk drugi" id="utworz">Utwórz konto</button>
      </div>
      <button type="button" class="link" id="reset">Nie pamiętam hasła</button>
      <p class="komunikat" id="komunikat-logowania" role="status" aria-live="polite"></p>
    </form>
  </section>

  <!-- ekran główny: lekcje -->
  <section id="glowna" class="ukryte">
    <div class="naglowek">
      <div>
        <p class="powitanie" id="powitanie">Cześć! 👋</p>
        <small>Nauka angielskiego</small>
      </div>
      <button class="przycisk drugi" id="wyloguj" type="button">Wyloguj</button>
    </div>
    <div class="wymowa">Wymowa:
      <span class="przelacznik" role="group" aria-label="Akcent">
        <button type="button" data-akcent="en-GB" aria-pressed="true">UK</button>
        <button type="button" data-akcent="en-US" aria-pressed="false">US</button>
      </span>
    </div>
    <div id="kot-glowna"></div>
    <h2>Nowa lekcja</h2>
    <form id="nowa-lekcja" autocomplete="off">
      <input type="text" id="nazwa-lekcji" placeholder="Nazwa, np. Lekcja 1" maxlength="60" aria-label="Nazwa lekcji">
      <button class="przycisk" type="submit">Dodaj</button>
    </form>
    <p class="komunikat" id="komunikat-glowna" role="status" aria-live="polite"></p>
    <h2>Moje lekcje</h2>
    <ul id="lista-lekcji"></ul>
  </section>

  <!-- widok lekcji -->
  <section id="lekcja" class="ukryte">
    <button class="link" id="wroc-glowna" type="button">← Wszystkie lekcje</button>
    <div class="tytul-wiersz">
      <h1 id="tytul-lekcji"></h1>
      <button class="ikona" id="edytuj-lekcje" type="button" aria-label="Zmień nazwę lekcji" title="Zmień nazwę">✏️</button>
      <button class="ikona" id="usun-lekcje" type="button" aria-label="Usuń lekcję" title="Usuń lekcję">🗑️</button>
    </div>
    <form id="formularz-nazwy" class="edycja ukryte" autocomplete="off">
      <input type="text" id="pole-nazwy" maxlength="60" aria-label="Nowa nazwa lekcji">
      <div class="rzad">
        <button type="submit" class="przycisk">Zapisz</button>
        <button type="button" class="przycisk drugi" id="anuluj-nazwe">Anuluj</button>
      </div>
    </form>
    <div id="potwierdz-usuniecie" class="potwierdzenie ukryte">
      <p>Usunąć tę lekcję razem ze wszystkimi jej słówkami? Tego nie da się cofnąć.</p>
      <div class="rzad">
        <button type="button" class="przycisk" id="tak-usun" style="background: var(--blad); color: #fff">Usuń</button>
        <button type="button" class="przycisk drugi" id="nie-usun">Anuluj</button>
      </div>
    </div>
    <p class="komunikat" id="podsumowanie-lekcji"></p>
    <div class="rzad">
      <button class="przycisk" id="start-wszystkie" type="button">🃏 Fiszki</button>
      <button class="przycisk drugi" id="start-nieumiane" type="button">Tylko nieumiane</button>
    </div>

    <h2>Dodaj słówko</h2>
    <form id="nowe-slowko" autocomplete="off">
      <div class="pole-en">
        <button type="button" class="emotka-przycisk" id="emotka-nowego" aria-label="Zmień obrazek" title="Dotknij, żeby zmienić obrazek">🔤</button>
        <input type="text" id="pole-en" placeholder="Po angielsku, np. light" maxlength="60" aria-label="Słówko po angielsku" autocapitalize="none" autocorrect="off" spellcheck="false">
        <button type="button" class="glosnik" id="posluchaj-nowego" aria-label="Posłuchaj wymowy" title="Posłuchaj wymowy">🔊</button>
      </div>
      <input type="text" id="pole-pl" placeholder="Po polsku, np. światło" maxlength="120" aria-label="Znaczenie po polsku">
      <input type="text" id="pole-przyklad" placeholder="Przykład użycia (nieobowiązkowo)" maxlength="160" aria-label="Przykład użycia">
      <div class="rzad">
        <a class="przycisk drugi" id="diki" href="https://www.diki.pl/" target="_blank" rel="noopener">Sprawdź w Diki</a>
        <button type="submit" class="przycisk">Dodaj słówko</button>
      </div>
    </form>
    <p class="komunikat" id="komunikat-slowka" role="status" aria-live="polite"></p>
    <h2>Słówka w lekcji</h2>
    <ul id="lista-slowek"></ul>
  </section>

  <!-- fiszki -->
  <section id="fiszki" class="ukryte">
    <button class="link" id="wroc-lekcja" type="button">← Wróć do lekcji</button>
    <div class="rzad" style="align-items:center; justify-content: space-between; margin-top:.4rem">
      <span class="przelacznik" role="group" aria-label="Kierunek">
        <button type="button" data-kierunek="en-pl" aria-pressed="true">EN → PL</button>
        <button type="button" data-kierunek="pl-en" aria-pressed="false">PL → EN</button>
      </span>
      <span class="przelacznik" role="group" aria-label="Akcent">
        <button type="button" data-akcent="en-GB" aria-pressed="true">UK</button>
        <button type="button" data-akcent="en-US" aria-pressed="false">US</button>
      </span>
    </div>
    <div id="fiszka-tresc"></div>
  </section>

</div>

const EMO_BEZ = new Set(["table", "window"]);
function emoNormalizuj(s) {
  return String(s).toLowerCase().replace(/[^a-z0-9' \-]/g, " ").replace(/\s+/g, " ").trim();
}
function emoFormy(slowo) {
  const f = [slowo];
  const dodaj = (x) => { if (x && x.length > 1 && !f.includes(x)) f.push(x); };
  if (slowo.endsWith("ies")) dodaj(slowo.slice(0, -3) + "y");
  if (slowo.endsWith("ves")) { dodaj(slowo.slice(0, -3) + "f"); dodaj(slowo.slice(0, -3) + "fe"); }
  if (slowo.endsWith("es")) dodaj(slowo.slice(0, -2));
  if (slowo.endsWith("s")) dodaj(slowo.slice(0, -1));
  for (const koncowka of ["ing", "ed"]) {
    if (slowo.endsWith(koncowka) && slowo.length > koncowka.length + 2) {
      const b = slowo.slice(0, -koncowka.length);
      dodaj(b); dodaj(b + "e");
      if (b.length > 2 && b[b.length - 1] === b[b.length - 2]) dodaj(b.slice(0, -1));
    }
  }
  return f;
}
let EMO_INDEKS = null;
function emoPrzygotuj() {
  if (EMO_INDEKS) return EMO_INDEKS;
  EMO_INDEKS = EMO.map(([emoji, label, tagi], i) => ({
    emoji, label, i,
    slowaLabel: label.split(/[ \-:,'’]+/),
    tagi: tagi ? tagi.split(",") : [],
  }));
  return EMO_INDEKS;
}
function emoOcena(w, forma) {
  if (w.label === forma) return 100;
  if (w.label.startsWith(forma + " ") || w.label.endsWith(" " + forma)) return 70;
  if (w.slowaLabel.includes(forma)) return 55;
  if (w.tagi.includes(forma)) return 40;
  return 0;
}
function emoSzukaj(wyrazenie, mnoznik) {
  const wyniki = new Map();
  for (const forma of emoFormy(wyrazenie)) {
    for (const w of emoPrzygotuj()) {
      const o = emoOcena(w, forma) * mnoznik - (forma === wyrazenie ? 0 : 5);
      if (o > 0) {
        const poprz = wyniki.get(w.emoji);
        if (!poprz || o > poprz.o) wyniki.set(w.emoji, { o, i: w.i, d: w.label.length });
      }
    }
  }
  return wyniki;
}

// Zwraca listę propozycji emotek (najlepsza pierwsza), do 8 sztuk.
function emotkiDla(tekst) {
  let t = emoNormalizuj(tekst);
  t = t.replace(/^(to|a|an|the) /, "");
  if (t.length < 2 || EMO_STOP.has(t) || EMO_BEZ.has(t)) return [];
  const lista = [];
  const dodaj = (e) => { if (e && !lista.includes(e)) lista.push(e); };

  for (const forma of emoFormy(t)) (EMO_PIERWSZENSTWO[forma] || []).forEach(dodaj);

  const wyniki = emoSzukaj(t, 1);
  if (t.includes(" ") && wyniki.size === 0) {              // wyrażenie złożone: szukaj po słowach
    const slowa = t.split(" ").filter((s) => s.length > 1 && !EMO_STOP.has(s)).reverse();
    for (const s of slowa) {
      (EMO_PIERWSZENSTWO[s] || []).forEach(dodaj);
      for (const [e, v] of emoSzukaj(s, 0.5)) if (!wyniki.has(e)) wyniki.set(e, v);
    }
  }
  [...wyniki.entries()]
    .sort((a, b) => b[1].o - a[1].o || a[1].i - b[1].i || a[1].d - b[1].d)
    .forEach(([e]) => dodaj(e));
  return lista.slice(0, 8);
}

  const t = tablica.slice();
  for (let i = t.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [t[i], t[j]] = [t[j], t[i]];
  }
  return t;
}
const odmianaSlowek = (n) => {
  if (n === 1) return "słówko";

};

/* ---------- kot: statystyki nauki i reakcje ---------- */
let statystyki = null;                 // { ostatnio: "RRRR-MM-DD", seria, dzisiaj }
const refStatystyk = () => doc(db, "uzytkownicy", uid, "statystyki", "postep");
function dzienLokalny(d = new Date()) {
  const p = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function roznicaDni(a, b) {
  const [ay, am, ad] = a.split("-").map(Number);
  const [by, bm, bd] = b.split("-").map(Number);
  return Math.round((Date.UTC(by, bm - 1, bd) - Date.UTC(ay, am - 1, ad)) / 86400000);
}
function nowaSeria(stat, dzis) {
  if (!stat || !stat.ostatnio) return { ostatnio: dzis, seria: 1, dzisiaj: 1 };
  const r = roznicaDni(stat.ostatnio, dzis);
  if (r <= 0) return { ostatnio: dzis, seria: Math.max(1, stat.seria || 1), dzisiaj: (stat.dzisiaj || 0) + 1 };
  if (r === 1) return { ostatnio: dzis, seria: (stat.seria || 0) + 1, dzisiaj: 1 };
  return { ostatnio: dzis, seria: 1, dzisiaj: 1 };
}
const odmianaFiszek = (n) => {
  if (n === 1) return "fiszka";
  const d = n % 10, dd = n % 100;
  return d >= 2 && d <= 4 && !(dd >= 12 && dd <= 14) ? "fiszki" : "fiszek";
};
const odmianaDni = (n) => n === 1 ? "dzień" : "dni";
function stanKota(stat, dzis) {
  if (!stat || !stat.ostatnio) return { nastroj: "ciekawy", tekst: "Miau! Dodaj lekcję i zacznijmy naukę. 🐾", seria: 0 };
  const r = roznicaDni(stat.ostatnio, dzis);
  if (r <= 0) return { nastroj: "szczesliwy", tekst: `Dziś ćwiczenia: ${stat.dzisiaj} ${odmianaFiszek(stat.dzisiaj)}. Mrrr, świetnie!`, seria: stat.seria || 1 };
  if (r === 1) return { nastroj: "ciekawy", tekst: "Dziś jeszcze bez ćwiczeń. Kilka fiszek i seria trwa!", seria: stat.seria || 1 };
  if (r < 7) return { nastroj: "spiacy", tekst: "Zasnąłem, czekając… Wróćmy do nauki!", seria: 0 };
  return { nastroj: "smutny", tekst: `Tęsknię! Minęło ${r} dni bez nauki.`, seria: 0 };
}
const losuj = (t) => t[Math.floor(Math.random() * t.length)];

  if (!sesja) return;
  // pomiń słówka usunięte w trakcie (np. na drugim urządzeniu)
  while (sesja.i < sesja.ids.length && !slowka.find((s) => s.id === sesja.ids[sesja.i])) sesja.i++;

  if (sesja.i >= sesja.ids.length) {
    const w = document.createElement("div");
    w.className = "wynik";
    const em = kotIkona(sesja.nie === 0 ? "swietuje" : "szczesliwy", true);
    const t = document.createElement("h1");
    t.textContent = "Koniec fiszek!";
    const p = document.createElement("p");
    p.className = "opis";
    p.textContent = `Umiem: ${sesja.umiem} · jeszcze nie: ${sesja.nie}` +
      (sesja.nie === 0 ? " · Miau-sterka!" : "");
    const rzad = document.createElement("div");
    rzad.className = "rzad";
    if (sesja.nie > 0) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "przycisk"; b.textContent = "Powtórz nieumiane";
      b.addEventListener("click", () => startFiszek(true));
      rzad.append(b);
    }
    const wroc = document.createElement("button");
    wroc.type = "button"; wroc.className = "przycisk drugi"; wroc.textContent = "Wróć do lekcji";
    wroc.addEventListener("click", () => { sesja = null; pokaz("lekcja"); rysujLekcje(); });
    rzad.append(wroc);
    w.append(em, t, p, rzad);
    kont.append(w);
    return;
  }

  const s = slowka.find((x) => x.id === sesja.ids[sesja.i]);
  const postep = document.createElement("div");
  postep.className = "postep";
  const lewo = document.createElement("span");
  lewo.textContent = `${sesja.i + 1} / ${sesja.ids.length}`;
  postep.append(lewo);
  const pasek = document.createElement("div");
  pasek.className = "pasek";
  const wyp = document.createElement("span");
  wyp.style.width = `${Math.round(100 * sesja.i / sesja.ids.length)}%`;
  pasek.append(wyp);

  const frontEn = kierunek === "en-pl";
  const karta = document.createElement("button");
  karta.type = "button";
  karta.className = "fiszka" + (sesja.odwrocona ? " odwrocona" : "");
  const obrazek = obrazekSlowka(s);
  const dodajObrazek = () => {
    if (!obrazek) return;
    const o = document.createElement("div");
    o.className = "obrazek";
    o.setAttribute("aria-hidden", "true");
    o.textContent = obrazek;
    karta.append(o);
  };
  const slowo = document.createElement("div");
  slowo.className = "slowo";
  dodajObrazek();
  if (!sesja.odwrocona) {
    slowo.textContent = frontEn ? s.en : s.pl;
    const wsk = document.createElement("div");
    wsk.className = "podpowiedz";
    wsk.textContent = "Dotknij, żeby zobaczyć odpowiedź";
    karta.append(slowo, wsk);
  } else {
    slowo.textContent = frontEn ? s.pl : s.en;
    karta.append(slowo);
    if (s.przyklad) {
      const pr = document.createElement("div");
      pr.className = "przyklad";
      pr.textContent = s.przyklad;
      karta.append(pr);
    }
  }
  karta.addEventListener("click", () => { sesja.odwrocona = !sesja.odwrocona; rysujFiszke(); });

  kont.append(kotPasek(sesja.kot.nastroj, sesja.kot.tekst, sesja.kot.swiezy, 0), postep, pasek, karta);
  sesja.kot.swiezy = false;

  const angielskiWidoczny = frontEn || sesja.odwrocona;
  if (angielskiWidoczny) {
    const g = document.createElement("button");
    g.type = "button";
    g.className = "przycisk drugi";
    g.style.width = "100%";
    g.style.marginBottom = ".6rem";
    g.textContent = "🔊 Posłuchaj";
    g.addEventListener("click", () => mow(s.en));
    kont.append(g);
  }
  if (sesja.odwrocona) {
    const rzad = document.createElement("div");
    rzad.className = "rzad";
    const nie = document.createElement("button");
    nie.type = "button"; nie.className = "przycisk drugi"; nie.textContent = "Jeszcze nie";
    nie.addEventListener("click", () => odpowiedz(s, false));
    const tak = document.createElement("button");
    tak.type = "button"; tak.className = "przycisk ok"; tak.textContent = "Umiem ✓";
    tak.addEventListener("click", () => odpowiedz(s, true));
    rzad.append(nie, tak);
    kont.append(rzad);
  }
}
async function odpowiedz(s, znam) {
  if (!sesja) return;
  if (znam) sesja.umiem++; else sesja.nie++;
  sesja.kot = znam
    ? { nastroj: "szczesliwy", tekst: losuj(POCHWALY), swiezy: true }
    : { nastroj: "smutny", tekst: losuj(POCIESZENIA), swiezy: true };
  sesja.i++;
  sesja.odwrocona = false;
  rysujFiszke();
  statystyki = nowaSeria(statystyki, dzienLokalny());
  try { setDoc(refStatystyk(), statystyki, { merge: true }).catch(() => {}); } catch (e) { /* zapisze się później */ }
  try { await updateDoc(refSlowka(s.id), { znam }); } catch (e) { /* zapisze się po powrocie sieci */ }
}

/* ---------- start i subskrypcje ---------- */
function zatrzymaj() {
  odsub.forEach((f) => f());
  odsub = [];
}
function start(uzytkownik) {
  uid = uzytkownik.uid;
  const imie = uzytkownik.displayName || (uzytkownik.email || "").split("@")[0];
  $("powitanie").textContent = `Cześć, ${imie.charAt(0).toUpperCase() + imie.slice(1)}! 👋`;
  odswiezAkcent();
  pokaz("glowna");
  zatrzymaj();
  const blad = (err) => komunikat(kGlowna, opisBledu(err), "blad");
  odsub.push(onSnapshot(
    query(collection(db, "uzytkownicy", uid, "lekcje"), orderBy("utworzono", "asc")),
    (snap) => {
      lekcje = snap.docs.map((d) => {
        const x = d.data({ serverTimestamps: "estimate" });
        return { id: d.id, nazwa: String(x.nazwa || ""), utworzono: milisekundy(x.utworzono) };
      });
      komunikat(kGlowna, "");
      if (biezacaId && !biezaca()) { biezacaId = null; sesja = null; pokaz("glowna"); }
      rysujGlowna();
      if (biezacaId && !$("lekcja").classList.contains("ukryte")) rysujLekcje();
    }, blad));
  odsub.push(onSnapshot(
    query(collection(db, "uzytkownicy", uid, "slowka"), orderBy("utworzono", "asc")),
    (snap) => {
      slowka = snap.docs.map((d) => {
        const x = d.data({ serverTimestamps: "estimate" });
        return {
          id: d.id, lekcja: String(x.lekcja || ""), en: String(x.en || ""), pl: String(x.pl || ""),
          przyklad: String(x.przyklad || ""), emotka: typeof x.emotka === "string" ? x.emotka : undefined, znam: !!x.znam, utworzono: milisekundy(x.utworzono)
        };
      });
      rysujGlowna();
      if (biezacaId && !$("lekcja").classList.contains("ukryte")) rysujLekcje();
      // przerysuj fiszkę tylko, gdy bieżące słówko zniknęło (np. usunięte na drugim urządzeniu)
      if (sesja && !$("fiszki").classList.contains("ukryte") && sesja.i < sesja.ids.length &&
          !slowka.find((x) => x.id === sesja.ids[sesja.i])) rysujFiszke();
    }, blad));
  odsub.push(onSnapshot(refStatystyk(), (snap) => {
    statystyki = snap.exists() ? snap.data() : null;
    rysujKotaGlownego();
  }, () => {}));
}

onAuthStateChanged(auth, (uzytkownik) => {
  zatrzymaj();
  lekcje = []; slowka = []; biezacaId = null; sesja = null; uid = null; statystyki = null;
  if (uzytkownik) start(uzytkownik);
  else { poleHaslo.value = ""; pokaz("logowanie"); }
});
</script>
